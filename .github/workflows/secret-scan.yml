name: secret-scan

on:
  pull_request:
  push:
    branches: [main]

jobs:
  secret-free:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: wrangler.toml must stay secret-free
        run: |
          set -euo pipefail
          if grep -nEi 'cfat_[A-Za-z0-9_-]+|api[_-]?key[[:space:]]*=|token[[:space:]]*=|secret[[:space:]]*=|-----BEGIN' wrangler.toml; then
            echo "::error file=wrangler.toml::Secret-looking material found in wrangler.toml. This repo is secret-free by rule: wrangler.toml carries only public values. Secrets live in the deploying Cloudflare account, never in git."
            exit 1
          fi
          echo "wrangler.toml is clean (public values only)"

      - name: no credential patterns in tracked files
        run: |
          set -euo pipefail
          PATTERNS='cfat_[A-Za-z0-9_-]{20,}|ghp_[A-Za-z0-9]{20,}|gho_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN (RSA |EC |DSA |OPENSSH )?PRIVATE KEY'
          if git grep -nEi "$PATTERNS" -- . ':!*.md'; then
            echo "::error::Credential-looking material found in tracked files (see matches above). Remove it and rotate the credential."
            exit 1
          fi
          echo "no credential patterns in tracked files"
