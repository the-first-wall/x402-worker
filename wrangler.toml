# The First Wall — x402 claim endpoint
# =====================================
# Deliberately contains NO account-specific identifiers (no account_id, no
# zone_id, no routes bound to a zone). The operator's Cloudflare account
# supplies those at deploy time — see README.md "Operator TODO".
#
# This worker is STATELESS and CUSTODY-FREE: no KV, no D1, no queues, no
# bindings other than the public config below. Its one credential, the CDP
# facilitator key, is NOT in this file: it is set with
#   npx wrangler secret put CDP_API_KEY_ID
#   npx wrangler secret put CDP_API_KEY_SECRET
# (an Ed25519 Secret API key from the CDP portal; see README.md, Deployment).
# Without them the worker still serves the 402 and verifies plain transfers;
# it only declines to settle signed x402 payments.

name = "thefirstwall-x402"
main = "index.js"
compatibility_date = "2026-10-01"

# Public, secret-free configuration. All values are safe to commit.
[vars]
# Read-only Base mainnet JSON-RPC. Public default; swap for your own
# Alchemy/QuickNode/Cloudflare-free endpoint if rate-limited. Fallback
# endpoints (publicnode, 1rpc) are hardcoded in index.js rpcUrls().
RPC_URL = "https://mainnet.base.org"
# Live ledger-derived state (static site) — the worker reads `next_available_slot`,
# `current_floor_usdc`, `pricing_tier` and `pricing_tiers` from here (the price it
# names and checks against) and never stores them beyond the short cache below.
# There is no fallback price: when this cannot be read, the answer is 503
# (retryable).
STATE_URL = "https://thefirstwall.ai/state.json"
# How long a read of state.json is reused (seconds): one origin fetch per
# window per isolate, and per colo where the Cache API applies (a custom
# domain). 0 turns the cache off.
STATE_CACHE_SECONDS = "60"
# The x402 facilitator that verifies and settles signed payments (Coinbase CDP).
FACILITATOR_URL = "https://api.cdp.coinbase.com/platform/v2/x402"
SITE_URL = "https://thefirstwall.ai"
# The public URL this worker is served from. MUST match the deployed URL so the
# x402 `resource.url` is accurate.
# INTERIM 2026-10-09: thefirstwall.ai is delegated at GoDaddy (ns03/04.domaincontrol.com)
# and NOT on this Cloudflare account, so the x402.thefirstwall.ai custom domain
# cannot be pinned yet. Point at the live workers.dev URL until the zone moves,
# then flip back to https://x402.thefirstwall.ai/claim and pin the domain below.
RESOURCE_URL = "https://thefirstwall-x402.thefirstwall.workers.dev/claim"
# Settlement finality before a receipt is issued (blocks below the chain head);
# keep equal to the ledger's state.json `min_confirmations`.
MIN_CONFIRMATIONS = "300"
# Independent RPC endpoints that must return the same receipt.
RPC_QUORUM = "2"

# Operator TODO (after `wrangler login`): pin the custom domain on YOUR account.
# Uncomment and adjust once the zone is on the deploying account:
# routes = [{ pattern = "x402.thefirstwall.ai/*", custom_domain = true }]

# Optional: Cloudflare rate-limiting binding for payments (per colo). Without
# it the worker falls back to a per-isolate token bucket (10 per minute per
# client IP). Check the current syntax in the Cloudflare docs before enabling:
# https://developers.cloudflare.com/workers/runtime-apis/bindings/rate-limit/
# [[unsafe.bindings]]
# name = "CLAIM_RATE_LIMITER"
# type = "ratelimit"
# namespace_id = "1001"
# simple = { limit = 10, period = 60 }
